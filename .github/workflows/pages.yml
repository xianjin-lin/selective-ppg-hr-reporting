name: Project page
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static page
        run: |
          mkdir -p _site/assets
          cp site/index.html _site/
          cp assets/logo.svg assets/project_page_preview.png \
             assets/external_evaluation.png assets/allocation_tradeoff.png \
             assets/label_coverage_heatmap.png assets/label_failure_heatmap.png \
             assets/study_design.png _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
